<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="shopping.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <img src="https://nguyenlehoainam.github.io/Web-Private/Week11/BTVN/assets/Logo.png" alt="">
        <div class="cartBadge">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge"></span>
        </div>
    </header>
    <div class="container">
        <div class="left">
            <div class="title"><i class="fa-solid fa-shop"></i>Danh sách sản phẩm</div>
            <div class="productList">
                
            </div>
        </div>

        <div class="cart">
            <div class="title">Giỏ hàng của bạn</div>
            <div class="cartList">
                
            </div>
            <div class="cartTotal">
                <span class="title">Tổng tiền:</span>
                <span class="totalPrice"></span>
            </div>
            <button class="payBills" onclick="payBills()">THANH TOÁN NGAY</button>
        </div>
    </div>
    <script src="shopping.js"></script>
</body>

</html>
