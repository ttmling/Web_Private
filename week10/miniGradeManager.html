<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        body{
            background-color: #628ecb;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        .card{
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 500px;
            gap: 1rem;
            padding: 2rem;
            background-color: #b1c9ef;
            border-radius: 1rem;
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.3);
        }
        #title{
            font-size: 25px;
        }
        input,
        button{
            width: 400px;
            height: 40px;
            border-radius: 0.5rem;
            border: none;
        }
        input{
            padding-left: 10px;
            font-size: 15px;
        }
        button{
            background-color: #395886;
            color: white;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        button:hover{
            background-color: #283f60;
            transform: scale(1.02);
        }
        .list{
            list-style-type: none;
            font-size: 18px;
            font-weight: bold;
            line-height: 30px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3 id="title">Nhập điểm sinh viên</h3>
        <input type="text" id="name" placeholder="Nhập tên">
        <input type="text" id="score" placeholder="Nhập điểm">
        <button onclick="add()">Thêm vào danh sách</button>

        <ul class="list"></ul>
    </div>
    
    <script src="manager.js"></script>
</body>
</html>
